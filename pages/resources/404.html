<!doctype html>
<html lang="en">
  <head>
    <title>pwgen - Page Not Found</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="pwgen Knowledge Hub - 404 Page Not Found"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --border-color: #334155;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent-cyan: #38bdf8;
        --accent-hover: #0284c7;
      }
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--bg-color);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: var(--text-primary);
      }
      .container {
        max-width: 480px;
        margin: 20px;
        padding: 40px 32px;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        text-align: center;
      }
      .icon-container {
        width: 80px;
        height: 80px;
        margin: 0 auto 24px;
      }
      h1 {
        font-size: 2rem;
        margin: 0 0 12px;
        font-weight: 700;
        color: var(--text-primary);
      }
      p {
        color: var(--text-secondary);
        font-size: 0.95rem;
        line-height: 1.5;
        margin: 0 0 28px;
      }
      .home-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 24px;
        background-color: var(--accent-cyan);
        color: #0f172a;
        font-weight: 600;
        text-decoration: none;
        border-radius: 8px;
        transition:
          background-color 0.2s ease,
          transform 0.1s ease;
      }
      .home-btn:hover {
        background-color: var(--accent-hover);
        color: #ffffff;
      }
    </style>
    <script>
      (function () {
        const l = window.location;
        const isLocalhost =
          l.hostname === "localhost" ||
          l.hostname === "127.0.0.1" ||
          l.hostname === "0.0.0.0";

        if (isLocalhost) return;

        sessionStorage.setItem(
          "shadow-claw-github-pages-404-redirect",
          l.pathname + l.search + l.hash,
        );

        l.replace("/pwgen-knowledge-hub/");
      })();
    </script>
  </head>
  <body>
    <div class="container">
      <div class="icon-container">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="6" fill="#1e293b" />
          <path
            d="M10 14V11a6 6 0 1 1 12 0v3h1a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V15a1 1 0 0 1 1-1h1zm3-3a3 3 0 0 1 6 0v3h-6v-3zm3 7a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"
            fill="#38bdf8"
          />
        </svg>
      </div>
      <h1>404 - Page Not Found</h1>
      <p>
        The pwgen knowledge node or route you requested could not be located.
      </p>
      <a href="./" class="home-btn">Return to Knowledge Hub</a>
    </div>
  </body>
</html>
